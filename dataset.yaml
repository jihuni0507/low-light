# Injection network dataset.
# Each sample must contain a source Gaussian PLY, a target Gaussian PLY,
# and the context used to produce the target appearance.

dataset:
	name: low_light_injection
	root: "."
	samples: []

# Example sample format:
# dataset:
#   samples:
#   - id: office1_day
#     gaussian_ply: "../StereoGS/output/LLFF/office1_3views/point_cloud/iteration_30000/point_cloud.ply"
#     target_ply: "datasets/targets/office1_day/point_cloud.ply"
#     context:
#       type: text
#       value: "a brightly lit daytime scene"
#
#   - id: office1_low_light
#     gaussian_ply: "../StereoGS/output/LLFF/office1_3views/point_cloud/iteration_30000/point_cloud.ply"
#     target_ply: "datasets/targets/office1_low_light/point_cloud.ply"
#     context:
#       type: image
#       value: "datasets/conditions/office1_low_light.png"

# Dataset-wide validation settings.
validation:
	require_target_ply: true
	require_matching_gaussian_count: true
	require_matching_sh_shape: true
